{% extends "base.html" %}
{% block title %}Cadastrar — EcoBateria{% endblock %}
{% block content %}
<section class="auth-box">
  <h1>Criar conta</h1>
  <p class="muted">Cadastre-se para registrar arrecadações e ver pontos de coleta.</p>
  <form method="post" action="{{ url_for('auth.cadastro') }}" novalidate>
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required autocomplete="name"
           value="{{ request.form.nome or '' }}">

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email"
           value="{{ request.form.email or '' }}">

    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">

    <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
  </form>
  <p class="muted center">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
